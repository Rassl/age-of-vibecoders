<!--
  Link previews (iMessage, Telegram, Slack, X, Discord, Facebook) read these
  tags; none of them run JS. og:image must be an ABSOLUTE URL for the strict
  scrapers, so it is prefixed with VITE_SITE_URL from .env (Vite substitutes
  %VITE_*% in HTML at build time). Set it to the deployed origin, no trailing
  slash. The card itself is public/og.png, 1200x630.
-->

<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0b0d10; color: #f4f1ea;
    font-family: "Bahnschrift", "DIN Alternate", "Oswald", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none; touch-action: none; user-select: none;
  }
  /* The mode is designed around a tall, narrow corridor. On a wide window we
     letterbox to a portrait stage rather than showing acres of empty desert with
     the squad as a speck in the middle. */
  #app { position: fixed; inset: 0; background: radial-gradient(ellipse at center,#24333b 0%,#10191f 48%,#080d11 100%);
         display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; overflow: hidden;
           box-shadow: 0 0 0 1px #1c2026, 0 20px 80px rgba(0,0,0,.6); }
  #game-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Cinematic vignette over the canvas, under the HUD. Composited by the
     browser, so it costs the GPU nothing per frame. Kept subtle: it frames the
     corridor without eating the readable value range at the screen edges. */
  #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 5;
              background:
                radial-gradient(140% 105% at 50% 42%, transparent 58%, rgba(8,6,4,.32) 100%),
                linear-gradient(rgba(6,16,24,.82), rgba(6,16,24,.24) 12%, transparent 24%); }
  #hud { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
  #overlay { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; }
</style>
